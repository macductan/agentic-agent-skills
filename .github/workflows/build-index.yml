name: Build Skills Index

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/build_index.py'
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight to sync upstream skills
  workflow_dispatch: # Allow manual trigger

jobs:
  build-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push commits back

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync skills from upstream (sickn33)
        run: |
          echo "Cloning upstream repo..."
          git clone --depth 1 https://github.com/sickn33/agentic-awesome-skills.git /tmp/upstream
          echo "Copying skills to local directory..."
          mkdir -p agentic-awesome-skills
          # Copy all folders from upstream root, ignoring git files
          rsync -a /tmp/upstream/ agentic-awesome-skills/ --exclude '.git' --exclude '.github' --exclude 'README.md'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run build_index.py
        run: |
          python scripts/build_index.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agentic-awesome-skills/
          git add scripts/skills-index.json
          
          # Only commit if there are changes
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-sync skills from upstream and update index [skip ci]"
            git push
          else
            echo "No changes to sync."
          fi
